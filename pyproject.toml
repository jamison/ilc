[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ilc-core"
version = "0.4.15"
description = "ILC Protocol Core Library"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}
dependencies = [
    "fastapi>=0.100.0",
    "starlette>=1.0.1",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.2",
    "requests>=2.31.0",
    "httpx>=0.24.0",
    "numpy>=1.24.0",
    "cbor2>=5.0.0",
    "cryptography>=48.0.0",
    "grpcio>=1.80.0",
    "protobuf>=6.30.0",
    "PyNaCl==1.6.2",
    "jsonschema>=4.0.0",
    "lmdb>=2.2.0",
    "py-ecc>=8.0.0,<9",
    "PyYAML>=6.0.0",
    "typing-extensions>=4.8.0",
]

[project.optional-dependencies]
# Minimal install for consensus-only testing. Consensus modules have no
# external dependencies beyond stdlib; only pytest is required.
# Usage: pip install -e ".[consensus-only]"
consensus-only = [
    "pytest>=7.0.0",
]
# Canonical package profiles (Gap 14, Phase 1436a)
# These are Python packaging profiles only — not ADR-0009 protocol-native bundle layers.
protocol-core = [
    "cbor2>=5.0.0",
    "cryptography>=48.0.0",
    "PyNaCl==1.6.2",
    "jsonschema>=4.0.0",
]
operator-node = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "httpx>=0.24.0",
    "numpy>=1.24.0",
    "cbor2>=5.0.0",
    "cryptography>=48.0.0",
    "grpcio>=1.80.0",
    "protobuf>=6.30.0",
    "PyNaCl==1.6.2",
    "jsonschema>=4.0.0",
    "lmdb>=2.2.0",
    "py-ecc>=8.0.0,<9",
    "PyYAML>=6.0.0",
    "typing-extensions>=4.8.0",
]
openclaw-hosted = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "httpx>=0.24.0",
    "cbor2>=5.0.0",
    "cryptography>=48.0.0",
    "PyNaCl==1.6.2",
    "jsonschema>=4.0.0",
]
# public-rc: canonical profile for external operator deployment at public RC.
# Identical to operator-node; defined separately for semantic clarity.
public-rc = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "httpx>=0.24.0",
    "numpy>=1.24.0",
    "cbor2>=5.0.0",
    "cryptography>=48.0.0",
    "grpcio>=1.80.0",
    "protobuf>=6.30.0",
    "PyNaCl==1.6.2",
    "jsonschema>=4.0.0",
    "lmdb>=2.2.0",
    "py-ecc>=8.0.0,<9",
    "PyYAML>=6.0.0",
    "typing-extensions>=4.8.0",
]
# Optional analysis stack used by spectral and embedding tooling.
analytics = [
    "scipy>=1.11.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
]
# Optional graph visualization sidecar invoked by `ilc sidecar graph-viz`.
graph-viz = [
    "ilc-graph-viz>=0.1.0",
]
# Optional post-quantum transport dependency. CCSS-SPECTRAL-01 uses pyca
# cryptography's ML-KEM support; liboqs remains out of the default install path
# until a later phase vets its build/KAT posture.
post-quantum = [
    "cryptography>=48.0.0",
]
# Full development environment including server, protocol, and test stack.
# Usage: pip install -e ".[dev]"
dev = [
    "pytest>=7.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "httpx>=0.24.0",
    "numpy>=1.24.0",
    "cbor2>=5.0.0",
    "cryptography>=48.0.0",
    "grpcio>=1.80.0",
    "protobuf>=6.30.0",
    "PyNaCl==1.6.2",
    "jsonschema>=4.0.0",
    "lmdb>=2.2.0",
    "py-ecc>=8.0.0,<9",
    "PyYAML>=6.0.0",
    "typing-extensions>=4.8.0",
    "scipy>=1.11.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = [
    ".git",
    ".pytest_cache",
    ".venv",
    "build",
    "dist",
    "ilc-ccss-sidecar",
    "ilc-timecapsule-sidecar",
    "out",
]
markers = [
    "expensive_release_artifact: release-artifact build/install proof tests that require ILC_RUN_EXPENSIVE_RELEASE_ARTIFACT_TESTS=1",
    "historical_phase_snapshot: archived phase-snapshot tests that assert historical repository state and require ILC_RUN_HISTORICAL_PHASE_SNAPSHOT_TESTS=1",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "ilc_core",
    "ilc_core.analysis",
    "ilc_core.bundle",
    "ilc_core.ccss",
    "ilc_core.cli",
    "ilc_core.consensus",
    "ilc_core.crypto",
    "ilc_core.data",
    "ilc_core.distribution",
    "ilc_core.economics",
    "ilc_core.encoding",
    "ilc_core.epistemic",
    "ilc_core.epoch",
    "ilc_core.eve",
    "ilc_core.genesis",
    "ilc_core.graph",
    "ilc_core.identity",
    "ilc_core.ledger",
    "ilc_core.mining",
    "ilc_core.network",
    "ilc_core.network.d2d",
    "ilc_core.network.relay",
    "ilc_core.network.star_map",
    "ilc_core.node",
    "ilc_core.privacy",
    "ilc_core.protocol",
    "ilc_core.protocol.schemas",
    "ilc_core.rc",
    "ilc_core.release",
    "ilc_core.reputation",
    "ilc_core.schema",
    "ilc_core.security",
    "ilc_core.sidecars",
    "ilc_core.sim",
    "ilc_core.sim.sim_fetch_01",
    "ilc_core.star_map",
    "ilc_core.storage",
    "ilc_core.testing",
    "ilc_core.validator",
    "ilc_core.work",
]

[tool.setuptools.package-data]
"ilc_core.mcp.schemas" = ["*.json"]
"ilc_core.genesis" = ["*.json"]
"ilc_core.protocol.schemas" = ["*.json"]
"ilc_core.data" = ["*.json"]

[tool.ilc.genesis-package-membership]
fix82_public_protocol_graph_additions = [
    "docs/specs/ilc_open_obligation_register_v0.1.md",
    "ilc_core/distribution/genesis_package_manifest.py",
    "tests/test_phase_1545p_fix65_package_membership_manifest.py",
    "tools/build_fix40_post_fix38_integrity_coverage.py",
    "tools/build_genesis_claim_composition_projection.py",
    "tools/build_genesis_implementation_manifest.py",
    "tools/build_genesis_toolchain_manifest.py",
    "tools/build_test_registry_frontier_report.py",
    "tools/evaluators/sim_genesis_atlas_fix66_hub_artifact_removal.py",
]

[project.scripts]
ilc = "ilc_core.cli.main:main"
ilc-canon-verify = "ilc_core.cli.canon_cli:main"
ilc-canon-summary = "ilc_core.cli.canon_consumer:main"
ilc-canon-export = "ilc_core.cli.canon_export:main"
ilc-canon-bundle-validate = "ilc_core.cli.canon_bundle_validate:main"
ilc-canon-bundle-sign = "ilc_core.cli.canon_bundle_sign:main"
ilc-canon-bundle-pipeline = "ilc_core.cli.canon_bundle_pipeline:main"
ilc-canon-bundle-replay = "ilc_core.cli.canon_bundle_replay:main"
ilc-canon-cluster-a-replay-proof = "ilc_core.cli.canon_cluster_a_replay_proof:main"
