name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-proof-release-gate:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: bash tools/check_cluster_a_replay_proof_release_gate.sh

  test:
    needs: replay-proof-release-gate
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: bash tools/check_domain_exception_migration_guardrails.sh
      - run: bash tools/check_track1_closure_guardrails.sh
      - run: bash tools/check_runtime_logging_guardrails.sh
      - run: python -m pytest -q
