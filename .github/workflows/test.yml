name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: python -m pytest tests/test_ilc_cluster_a_replay_proof_ci_gate.py -q
      - run: python -m pytest tests/test_ilc_cluster_a_replay_proof_ci_gate_baseline.py -q
      - run: python -m pytest tests/test_ilc_cluster_a_replay_proof_cli_ci_gate.py -q
