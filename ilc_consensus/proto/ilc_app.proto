syntax = "proto3";
package ilc_app;

// The Read-Only interface exposing DAG-Settled and Owned-Object state to Python.
// WRITES ARE EXPLICITLY BANNED. The python epistemic engine may NOT mutate ECU balances or consensus topologies.
service ILCAppReadService {
    rpc GetBalance (GetBalanceRequest) returns (GetBalanceResponse) {}
    rpc GetEpoch (GetEpochRequest) returns (GetEpochResponse) {}
    rpc GetEpochRecord (GetEpochRecordRequest) returns (GetEpochRecordResponse) {}
    rpc GetEpochChain (GetEpochChainRequest) returns (GetEpochChainResponse) {}
}

// Authenticated proposal ingress. This accepts an unsigned economic proposal,
// not a Python-supplied checkpoint. Rust validators own BFT signing and epoch
// checkpoint commitment after ingress validation.
service ILCAppProposalIngressService {
    rpc SubmitEpochProposal (SubmitEpochProposalRequest) returns (SubmitEpochProposalResponse) {}
}

message SubmitEpochProposalRequest {
    bytes  submitter_agent_id      = 1; // exactly 48 bytes
    uint64 epoch_number            = 2;
    bytes  state_root_cidv1        = 3; // exactly 36 bytes
    bytes  epoch_data_hash         = 4; // exactly 32 bytes SHA-256 digest
    bytes  settlement_record_bytes = 5; // bounded canonical economic evidence
    string idempotency_key         = 6; // lowercase 64-hex SHA-256 over canonical preimage
    uint64 not_before_unix_ms      = 7;
    string network_id              = 8;
}

message SubmitEpochProposalResponse {
    string status_token              = 1;
    string error_code                = 2;
    uint64 accepted_epoch_number     = 3;
    bytes  accepted_state_root_cidv1 = 4;
    string proposal_id               = 5;
}

message GetBalanceRequest {
    bytes agent_id = 1; // 48 bytes AgentID lookup target
}

message GetBalanceResponse {
    uint64 amount_micro_ecu = 1;
    uint64 version = 2; // Required explicitly for the Epistemic layer to construct transfer dependencies
    uint64 epoch = 3;
}

message GetEpochRequest {
}

message GetEpochResponse {
    uint64 current_epoch = 1;
}

message GetEpochRecordRequest {
    uint64 epoch = 1;
}

message GetEpochRecordResponse {
    uint64 epoch      = 1;
    bytes  state_root = 2;
    bytes  agg_sig    = 3;
    bool   found      = 4;
}

message GetEpochChainRequest {
    uint64 from_epoch    = 1;
    uint64 to_epoch      = 2;
    bool   include_edges = 3;
}

message GetEpochChainResponse {
    repeated GetEpochRecordResponse records  = 1;
    repeated EdgeRecord             edges    = 2;
    repeated HyperEdgeRecord        hyperedges = 3;
    bool                            chain_complete = 4;
}

// ---------------------------------------------------------------------------
// Subgraph query support — ADR-0031 forward reservation
//
// EdgeRecord and HyperEdgeRecord are reserved here so that future query
// response messages (added in M-018+) can include them without a breaking
// wire-format change.
//
// Subgraph Homomorphism Invariant (ADR-0031): when include_edges=true on any
// future query request, if both source_id and target_id of an edge are present
// in the returned node set, that edge MUST appear in the edges[] field.
// Omitting edges between returned nodes is a protocol violation.
//
// All future multi-node query REQUEST messages must include:
//   bool include_edges = N;   // default false
// All future multi-node query RESPONSE messages must include:
//   repeated EdgeRecord      edges      = N;   // empty when include_edges=false
//   repeated HyperEdgeRecord hyperedges = N;   // empty until ADR-0029 activated
// ---------------------------------------------------------------------------

// EdgeRecord: a single binary edge in a subgraph query response.
message EdgeRecord {
    string source_id   = 1;
    string target_id   = 2;
    string link_type   = 3; // "supports" | "refutes" | "depends_on" | "derives_from"
    float  weight      = 4; // 0.0 = unweighted (legacy — use weight_params when available)
    bytes  edge_payload = 5; // reserved future logic slot; null/empty = no-op per CDL
}

// WeightParams: committed parameters for deterministic edge weight computation.
// w(e,t) = α(edge_type) × f(reuse_count) × decay(stake, t)
// PROVISIONAL: reuse_count functional form and edge_type_coefficient values are
// unratified. SIM-REUSE-01 + CDL required before use in consensus-critical paths.
message WeightParams {
    string stake_micro_ecu        = 1; // Decimal ECU stake as canonical string (never float)
    uint64 reuse_count            = 2; // traversal counter; incremented on each edge access
    float  decay_rate             = 3; // CDL-V1 decay rate (0.0 = no decay)
    float  edge_type_coefficient  = 4; // α per edge type; provisional until CDL ratified
}

// HyperEdgeRecord: an n-ary relationship in a subgraph query response.
// Reserved now (ADR-0031). Populated after ADR-0029 hypergraph substrate is
// implemented. Fields will not be populated by M-018 query handlers — the
// message type exists only to reserve field numbers and prevent future
// wire-format breaking changes.
message HyperEdgeRecord {
    string          id             = 1;
    string          hyperedge_type = 2; // "panel" | "co_authorship" | "refutation_coalition" | "epoch_boundary" | "content_package"
    repeated string member_ids     = 3;
    repeated string head_ids       = 4; // directed source set; empty if undirected
    repeated string tail_ids       = 5; // directed target set; empty if undirected
    float           weight         = 6; // legacy raw weight; use weight_params for new records
    uint64          epoch          = 7;
    WeightParams    weight_params  = 8; // committed parameters; supersedes field 6 for new records
    bytes           edge_payload   = 9; // reserved future logic slot; null/empty = no-op per CDL
    string          edge_type      = 10; // EdgeType enum value as string; "" = legacy/unknown
}

// ---------------------------------------------------------------------------
// ClearanceRecord: signed traversal commitment generated at WANT-BLOCK
// delivery time (Wire Protocol layer, sub-30ms over QUIC/CDL-061).
//
// This is NOT settlement. ClearanceRecord commits that a traversal occurred;
// ECU attribution is discharged at epoch-close (Epoch State settlement).
// epoch_tag is set by the serving node at signing time — late-arriving
// records with epoch_tag=N that arrive after epoch-N settlement become
// epoch-N+1 obligations. Settlement never retroactively reopens a closed epoch.
//
// Gate: H-CON-01 CDL required before clearance records trigger ECU transfers.
// Message reserved now to prevent future wire-format breaking changes.
// All fields are empty/zero until the H-012 attribution runtime is wired.
// ---------------------------------------------------------------------------
message ClearanceRecord {
    string traversal_id        = 1; // unique ID for this traversal event
    string edge_id             = 2; // which edge was traversed
    uint64 epoch_tag           = 3; // epoch at signing time — canonical epoch assignment
    bytes  requesting_agent_id = 4; // 32-byte AgentID of the consuming agent
    bytes  serving_agent_id    = 5; // 32-byte AgentID of the serving node
    uint64 timestamp_ms        = 6; // Unix epoch milliseconds at clearance time
    bytes  signature           = 7; // Ed25519 signature by serving node over fields 1-6
}
