[package]
name = "ilc_consensus"
version = "0.1.0"
edition = "2021"
description = "ILC Sovereign Mysticeti consensus substrate"
license = "MIT"

[features]
testnet_fault_sim = []
# CAUTION: enables plaintext agent ID logging. Never enable in production or CI
# release builds. src/lib.rs rejects release builds with this feature enabled.
debug_agent_ids = []

[dependencies]
blst = "0.3.11"
lmdb_rkv = { package = "lmdb-rkv", version = "0.14" }  # Existing ILC LMDB pattern
quinn = "0.11"         # QUIC transport
tokio = { version = "1.36", features = ["full"] }
prost = "0.12"
tonic = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
bincode = "1.3.3"
getrandom = "0.2"
rustls = { version = "0.23", features = ["ring"] }
fips204 = { version = "0.4", features = ["ml-dsa-65"] }
fips205 = { version = "0.4", features = ["slh_dsa_sha2_128s"] }
bip39 = "2"
rand_core = "0.6"
sharks = "0.5"

[dev-dependencies]
tempfile = "3.10.1"
rcgen = "0.13"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.11"

[[bin]]
name = "validator_harness"
path = "src/main.rs"

[[bin]]
name = "keygen"
path = "src/keygen_main.rs"

[[bin]]
name = "testnet_client"
path = "src/testnet_client_main.rs"

[[bin]]
name = "state_extractor"
path = "src/state_extractor_main.rs"

[[bin]]
name = "ilc_dag_audit"
path = "src/dag_audit_main.rs"

[[bin]]
name = "pq_keygen"
path = "src/pq_keygen_main.rs"

[[bin]]
name = "shamir_split"
path = "src/shamir_split_main.rs"

[[bin]]
name = "shamir_recover"
path = "src/shamir_recover_main.rs"

# mysticeti-core will be added via path once extraction payload is prepared
