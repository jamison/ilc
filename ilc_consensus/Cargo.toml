[package]
name = "ilc_consensus"
version = "0.1.0"
edition = "2021"
description = "ILC Sovereign Mysticeti consensus substrate"
license = "MIT"

[dependencies]
blst = "0.3.11"
lmdb_rkv = { package = "lmdb-rkv", version = "0.14" }  # Existing ILC LMDB pattern
quinn = "0.11"         # QUIC transport
tokio = { version = "1.36", features = ["full"] }
prost = "0.12"
tonic = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
bincode = "1.3.3"
getrandom = "0.2"
rustls = { version = "0.23", features = ["ring"] }

[dev-dependencies]
tempfile = "3.10.1"
rcgen = "0.13"

[build-dependencies]
tonic-build = "0.11"

[[bin]]
name = "validator_harness"
path = "src/main.rs"

[[bin]]
name = "keygen"
path = "src/keygen_main.rs"

[[bin]]
name = "testnet_client"
path = "src/testnet_client_main.rs"

[[bin]]
name = "state_extractor"
path = "src/state_extractor_main.rs"

# mysticeti-core will be added via path once extraction payload is prepared
