[package]
name = "ilc_consensus"
version = "0.1.0"
edition = "2021"
description = "ILC high-speed object-sharded DAG consensus substrate"
license = "AGPL-3.0-only"

[features]
testnet_fault_sim = []
# CAUTION: enables plaintext agent ID logging. Never enable in production or CI
# release builds. src/lib.rs rejects release builds with this feature enabled.
debug_agent_ids = []

[dependencies]
blst = "0.3.11"
lmdb_rkv = { package = "lmdb-rkv", version = "0.14" }  # Existing ILC LMDB pattern
quinn = "0.11"         # QUIC transport
tokio = { version = "1.36", features = ["full"] }
prost = "0.14"
tonic = { version = "0.14", features = ["tls-ring", "tls-connect-info"] }
tonic-prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
bincode = "1.3.3"
getrandom = "0.2"
rustls = { version = "0.23", features = ["ring"] }
fips204 = { version = "0.4", features = ["ml-dsa-65"] }
fips205 = { version = "0.4", features = ["slh_dsa_sha2_128s"] }
bip39 = "2"
rand_core = { version = "0.6", features = ["std"] }
secret-sharing-rs = "0.5.1"
zeroize = "1.8"

[dev-dependencies]
tempfile = "3.10.1"
rcgen = "0.13"

[build-dependencies]
protox = "0.9.1"
tonic-prost-build = "0.14"

[[bin]]
name = "validator_harness"
path = "src/main.rs"

[[bin]]
name = "keygen"
path = "src/keygen_main.rs"

[[bin]]
name = "testnet_client"
path = "src/testnet_client_main.rs"

[[bin]]
name = "state_extractor"
path = "src/state_extractor_main.rs"

[[bin]]
name = "ilc_dag_audit"
path = "src/dag_audit_main.rs"

[[bin]]
name = "pq_keygen"
path = "src/pq_keygen_main.rs"

[[bin]]
name = "pq_sign"
path = "src/pq_sign_main.rs"

[[bin]]
name = "pq_agent_sign"
path = "src/pq_agent_sign_main.rs"

[[bin]]
name = "attribution_batch_ingest"
path = "src/attribution_batch_ingest_main.rs"

[[bin]]
name = "shamir_split"
path = "src/shamir_split_main.rs"

[[bin]]
name = "shamir_recover"
path = "src/shamir_recover_main.rs"

[[bin]]
name = "shamir_verify"
path = "src/shamir_verify_main.rs"

[[bin]]
name = "genesis_recovery_fake_vector"
path = "src/genesis_recovery_fake_vector_main.rs"

[[bin]]
name = "validator_endpoint_assertion_bls"
path = "src/validator_endpoint_assertion_bls_main.rs"

[[bin]]
name = "invite_pop_bls"
path = "src/invite_pop_bls_main.rs"

[[bin]]
name = "bls_verify_digest"
path = "src/bls_verify_digest_main.rs"

[[bin]]
name = "ilc_p2p_bridge"
path = "src/ilc_p2p_bridge_main.rs"

# ILC implements its own sovereign Mysticeti-style consensus loop here. The
# upstream mysticeti-core crate is not a current dependency or vendored source.
